[project]
name = "voices"
version = "0.2.2"
description = "Local MLX voice library CLI using Qwen3-TTS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tiziano Contorno", email = "57402651+Vanalio@users.noreply.github.com" }
]
requires-python = ">=3.14.10,<3.15"
dependencies = [
  "mlx-audio>=0.6.1",
  "mlx>=0.32.4",
  "transformers>=5.20.2",
  "typer>=0.27.3",
  "rich>=15.0.0",
  "numpy>=2.5.4",
  "pydantic>=2.14.1",
  "fastapi>=0.161.1",
  "starlette>=1.9.0",
  "httpx>=0.28.1",
  "uvicorn>=0.54.0",
  "python-multipart>=0.0.32",
]

[project.scripts]
voices = "voices.cli_entrypoint:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "voices/web_dist"
"NOTICE.md" = "voices/NOTICE.md"

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md", "LICENSE", "NOTICE.md"]

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "devtools"]
exclude = ["tests", "examples", ".venv"]
stubPath = "typings"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "httpx2>=2.16.0",
]
